<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#6f42c1" rx="30"/>

  <!-- Smile/Hello Symbol -->
  <circle cx="100" cy="85" r="35" fill="white" opacity="0.2"/>
  <circle cx="100" cy="85" r="30" fill="none" stroke="white" stroke-width="3"/>

  <!-- Eyes -->
  <circle cx="88" cy="75" r="4" fill="white"/>
  <circle cx="112" cy="75" r="4" fill="white"/>

  <!-- Smile -->
  <path d="M 88 90 Q 100 100 112 90" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Wave hand -->
  <g transform="translate(140, 50)">
    <rect width="25" height="35" fill="white" rx="4" transform="rotate(-25)"/>
    <circle cx="12" cy="-15" r="6" fill="white"/>
  </g>

  <!-- Sparkles -->
  <circle cx="50" cy="50" r="3" fill="white"/>
  <circle cx="160" cy="60" r="2" fill="white"/>
  <circle cx="165" cy="140" r="2.5" fill="white"/>
</svg>
